name: Otkliki Monitor

on:
  # Штатный schedule-триггер GitHub Actions ненадёжен на новых публичных репо
  # (троттлинг до ~1.5-2 часов вместо заданного интервала, см. LESSONS_LEARNED.md
  # пункт 2). Запуск дёргает внешний бесплатный cron-job.org через GitHub REST
  # API (workflow_dispatch), а не встроенный cron.
  #
  # action=monitor (по умолчанию, дёргает cron-job.org каждые 10 минут) — полный
  # обход каналов + превью-уведомления с кнопками. action=generate/delete дёргает
  # Cloudflare Worker (cloudflare-worker/webhook.js) по нажатию кнопки в Telegram —
  # генерирует черновик для одного кандидата или просто убирает его из pending/.
  workflow_dispatch:
    inputs:
      action:
        description: "monitor | generate | delete"
        required: false
        default: "monitor"
      candidate_id:
        description: "id кандидата для generate/delete"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: otkliki-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: bot
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run monitor pipeline
        if: ${{ github.event.inputs.action == 'monitor' || github.event.inputs.action == '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python monitor_telegram.py > candidates.json
          python classify.py < candidates.json > classified.json
          python preview_notify.py < classified.json

      - name: Generate draft for one candidate
        if: ${{ github.event.inputs.action == 'generate' }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python generate_one.py "${{ github.event.inputs.candidate_id }}"

      - name: Delete one candidate
        if: ${{ github.event.inputs.action == 'delete' }}
        run: python delete_candidate.py "${{ github.event.inputs.candidate_id }}"

      - name: Commit updated seen.json / pending / classify_cache.json
        if: always()
        run: |
          git config user.name "otkliki-monitor-bot"
          git config user.email "actions@users.noreply.github.com"

          # pending/ — папка, по файлу на кандидата (см. pending_store.py) —
          # раньше был единый pending.json, гонка на нём при параллельных
          # ранах (крон + клики кнопок) тихо теряла кандидатов через
          # `-X ours`. Разные раны теперь пишут в разные файлы, конфликтовать
          # нечему. classify_cache.json/unclassified.json могут не
          # существовать (если прогон ничего не классифицировал/не деградировал) —
          # добавляем их только если есть, иначе `git add` на несуществующий
          # путь падает и рвёт весь шаг.
          git add seen.json
          [ -d pending ] && git add pending/
          [ -f classify_cache.json ] && git add classify_cache.json
          [ -f unclassified.json ] && git add unclassified.json
          git diff --quiet --cached || git commit -m "chore: update seen.json/pending/classify_cache.json"

          # Эти файлы — самопополняемые, без единственно верной версии; при
          # почти одновременных запусках обычный `pull --rebase` падает в
          # конфликт и весь job красный, хотя черновик/удаление уже реально
          # отработали. Мержим с приоритетом своей версии и ретраим push —
          # потерять здесь можно разве что чужую пометку "уже обработано" в
          # seen.json/classify_cache.json, она пересоздастся сама. pending/
          # конфликтов не ловит вообще (разные файлы), это не про него.
          for i in 1 2 3 4 5; do
            git pull --no-rebase -X ours origin main && git push && break
            echo "push/pull попытка $i не удалась, повтор..."
            sleep $((i * 3))
          done
