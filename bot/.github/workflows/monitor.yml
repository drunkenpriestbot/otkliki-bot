name: Otkliki Monitor

on:
  # Штатный schedule-триггер GitHub Actions ненадёжен на новых публичных репо
  # (троттлинг до ~1.5-2 часов вместо заданного интервала, см. LESSONS_LEARNED.md
  # пункт 2). Запуск дёргает внешний бесплатный cron-job.org через GitHub REST
  # API (workflow_dispatch), а не встроенный cron.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: otkliki-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run pipeline
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python monitor_telegram.py > candidates.json
          python classify.py < candidates.json > classified.json
          python draft.py < classified.json > drafted.json
          python notify.py < drafted.json

      - name: Commit updated seen.json
        run: |
          git config user.name "otkliki-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen.json
          git diff --quiet --cached || git commit -m "chore: update seen.json"
          git pull --rebase origin main
          git push
